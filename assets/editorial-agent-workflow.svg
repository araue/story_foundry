<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Coding agents for elaborate creative work</title>
  <desc id="desc">Human editorial direction guides four groups of phases: literary research in phases 1 to 3, approved assumptions in phase 4, story design in phases 5 to 7, and drafting and review in phase 8. Coding agents research, propose, connect, draft, and revise. A versioned repository stores evidence, decisions, dependencies, and revisions as shared editorial memory. Drafting gaps return to assumptions or architecture for review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#627487" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #172b3d; }
      .subtitle { font-size: 18px; fill: #526578; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .heading { font-size: 25px; font-weight: 700; fill: #172b3d; }
      .body { font-size: 17px; fill: #344b5e; }
      .small { font-size: 15px; fill: #526578; }
      .connector { fill: none; stroke: #627487; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="780" rx="20" fill="#f7f9fc"/>
  <text x="48" y="60" class="title">How far can coding agents go in creative work?</text>
  <text x="48" y="92" class="subtitle">A literary project built around research, explicit decisions, and ongoing revision.</text>

  <!-- The editor guides every phase, not only the final manuscript. -->
  <rect x="48" y="122" width="1104" height="80" rx="14" fill="#172b3d"/>
  <text x="72" y="153" class="label" fill="#a7cfdd">HUMAN EDITOR</text>
  <text x="72" y="181" font-size="19" fill="#ffffff">Sets direction · weighs alternatives · approves key decisions · reviews chapters</text>
  <path d="M 175 202 V 272" class="connector"/>
  <path d="M 458 202 V 272" class="connector"/>
  <path d="M 741 202 V 272" class="connector"/>
  <path d="M 1024 202 V 272" class="connector"/>
  <rect x="388" y="222" width="424" height="29" rx="14" fill="#f7f9fc"/>
  <text x="600" y="242" text-anchor="middle" class="small">Editorial direction and review throughout</text>

  <!-- All eight phases, grouped into four understandable jobs. -->
  <rect x="48" y="280" width="254" height="214" rx="14" fill="#e9f3f5" stroke="#b9d5dc"/>
  <text x="70" y="311" class="label" fill="#256579">PHASES 1–3</text>
  <text x="70" y="346" class="heading">Research</text>
  <text x="70" y="380" class="small">1  Sources / creative baseline</text>
  <text x="70" y="408" class="body">2  Character analysis</text>
  <text x="70" y="436" class="body">3  Open questions</text>
  <text x="70" y="474" class="small">What is our starting point?</text>

  <path d="M 307 387 H 325" class="connector"/>
  <rect x="331" y="280" width="254" height="214" rx="14" fill="#fbf2e3" stroke="#dfcaa6"/>
  <text x="353" y="311" class="label" fill="#846020">PHASE 4</text>
  <text x="353" y="346" class="heading">Decisions</text>
  <text x="353" y="380" class="body">Assumptions + alternatives</text>
  <text x="353" y="408" class="body">Explicit human approval</text>
  <text x="353" y="436" class="body">Room for real unknowns</text>
  <text x="353" y="474" class="small">What are we choosing?</text>

  <path d="M 590 387 H 608" class="connector"/>
  <rect x="614" y="280" width="254" height="214" rx="14" fill="#eeedf8" stroke="#cbc6e4"/>
  <text x="636" y="311" class="label" fill="#635293">PHASES 5–7</text>
  <text x="636" y="346" class="heading">Story design</text>
  <text x="636" y="380" class="body">5  Architecture + briefs</text>
  <text x="636" y="408" class="body">6  Character arcs + cast</text>
  <text x="636" y="436" class="body">7  World building + maps</text>
  <text x="636" y="474" class="small">How does it all fit together?</text>

  <path d="M 873 387 H 891" class="connector"/>
  <rect x="897" y="280" width="255" height="214" rx="14" fill="#eaf3eb" stroke="#bfd5c2"/>
  <text x="919" y="311" class="label" fill="#3c6c46">PHASE 8</text>
  <text x="919" y="346" class="heading">Writing + review</text>
  <text x="919" y="380" class="body">One chapter at a time</text>
  <text x="919" y="408" class="body">Six revision passes</text>
  <text x="919" y="436" class="body">Review before next chapter</text>
  <text x="919" y="474" class="small">Does it work for the reader?</text>

  <!-- A failed handoff returns to its governing planning phase. -->
  <path d="M 1024 494 V 535 H 458 V 502" class="connector" stroke-dasharray="6 5"/>
  <path d="M 741 535 V 502" class="connector" stroke-dasharray="6 5"/>
  <text x="741" y="561" text-anchor="middle" class="small">Drafting gaps → revisit assumptions or architecture</text>

  <!-- The persistent workspace is the foundation for the entire process. -->
  <rect x="48" y="588" width="1104" height="144" rx="14" fill="#ffffff" stroke="#cbd5df"/>
  <text x="72" y="619" class="label" fill="#526578">SHARED EDITORIAL MEMORY · THE VERSIONED REPOSITORY</text>
  <text x="72" y="651" font-size="21" font-weight="600" fill="#172b3d">Evidence, decisions, plans, and prose stay connected across sessions.</text>
  <text x="72" y="684" class="body">Coding agents research, propose, connect, draft, and revise using files, search, and project tools.</text>
  <text x="72" y="711" class="small">Inspectable reasoning · tracked dependencies · revision history · repeatable edition builds</text>
  <text x="600" y="761" text-anchor="middle" class="small">The experiment: sustained creative work with visible reasoning and human judgment.</text>
</svg>
